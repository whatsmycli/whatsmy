name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              ..
    
    - name: Build
      run: cmake --build build --config Release -j$(nproc)
    
    - name: Strip binary
      run: strip build/whatsmy
    
    - name: Create package
      run: |
        cd build
        cpack -G TGZ
        mv whatsmy-*-linux-x64.tar.gz whatsmy-linux-x64.tar.gz
    
    - name: Generate checksum
      run: |
        cd build
        sha256sum whatsmy-linux-x64.tar.gz > whatsmy-linux-x64.tar.gz.sha256
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-release
        path: |
          build/whatsmy-linux-x64.tar.gz
          build/whatsmy-linux-x64.tar.gz.sha256

  build-windows:
    name: Build Windows Release
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
    
    - name: Build
      run: cmake --build build --config Release
    
    - name: Create package
      run: |
        cd build
        cpack -G ZIP -C Release
        move whatsmy-*-windows-x64.zip whatsmy-windows-x64.zip
    
    - name: Generate checksum
      run: |
        cd build
        $hash = Get-FileHash -Algorithm SHA256 whatsmy-windows-x64.zip
        "$($hash.Hash.ToLower())  whatsmy-windows-x64.zip" | Out-File -FilePath whatsmy-windows-x64.zip.sha256 -Encoding ASCII
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: |
          build/whatsmy-windows-x64.zip
          build/whatsmy-windows-x64.zip.sha256

  build-macos:
    name: Build macOS Release (Universal Binary)
    runs-on: macos-13
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install dependencies
      run: brew install cmake
    
    - name: Configure CMake (Universal Binary)
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              ..
    
    - name: Build
      run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)
    
    - name: Verify Universal Binary
      run: |
        file build/whatsmy
        lipo -info build/whatsmy
    
    - name: Strip binary
      run: strip build/whatsmy
    
    - name: Create package
      run: |
        cd build
        cpack -G TGZ
        mv whatsmy-*-macos-universal.tar.gz whatsmy-macos-universal.tar.gz
    
    - name: Generate checksum
      run: |
        cd build
        shasum -a 256 whatsmy-macos-universal.tar.gz > whatsmy-macos-universal.tar.gz.sha256
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-release
        path: |
          build/whatsmy-macos-universal.tar.gz
          build/whatsmy-macos-universal.tar.gz.sha256

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-linux, build-windows, build-macos]
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Organize artifacts
      run: |
        mkdir -p release-files
        
        # Move all files to release-files directory
        find artifacts -type f -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" | while read file; do
          mv "$file" release-files/
        done
        
        # Create combined checksums.txt
        cd release-files
        cat *.sha256 > checksums.txt
        
        # List all files
        ls -lh
    
    - name: Generate changelog
      id: changelog
      run: |
        echo "Generating changelog..."
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -z "$PREVIOUS_TAG" ]; then
          echo "CHANGELOG=Initial release" >> $GITHUB_OUTPUT
        else
          CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" | head -20)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
    
    - name: Determine if pre-release
      id: prerelease
      run: |
        if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
          echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
        else
          echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        body: |
          ## whatsmycli ${{ github.ref_name }}
          
          ### Installation
          
          **Linux/macOS:**
          ```bash
          curl -sSL https://raw.githubusercontent.com/whatsmycli/whatsmy/main/install.sh | bash
          ```
          
          **Windows PowerShell:**
          ```powershell
          irm https://raw.githubusercontent.com/whatsmycli/whatsmy/main/install.ps1 | iex
          ```
          
          **Manual Installation:**
          Download the appropriate binary for your platform below and extract it to your PATH.
          
          ### Changes
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ### Checksums
          See `checksums.txt` for SHA256 checksums of all release artifacts.
        files: release-files/*
        draft: false
        prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Release Summary
      run: |
        echo "✅ Release ${{ github.ref_name }} created successfully!"
        echo ""
        echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        echo ""
        echo "Artifacts created:"
        echo "  - whatsmy-linux-x64.tar.gz"
        echo "  - whatsmy-windows-x64.zip"
        echo "  - whatsmy-macos-universal.tar.gz"
        echo "  - checksums.txt"
